<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundScout</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <h1>SoundScout</h1>
      <span class="dot" aria-hidden="true"></span>
    </div>
    <p class="tagline">Find out how quiet a place really is, before you get there.</p>
    <button class="add-btn" id="open-add-venue">+ Add a venue</button>
  </div>

  <div class="filters">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Search venues by name…" aria-label="Search venues">
    </div>
    <div class="chip-row" id="category-chips" role="group" aria-label="Filter by category"></div>
    <div class="toggle-row">
      <label><input type="checkbox" id="filter-access"> Only show wheelchair / step-free access</label>
      <label><input type="checkbox" id="filter-toilet"> Only show gender-neutral toilets</label>
      <label>
    <input type="checkbox" id="toggle-heatmap">
    Show sound heatmap
  </label>
    </div>
  </div>

  <p class="list-meta" id="list-count">8 venues</p>
  <div id="venue-list"></div>
</div>

<div id="map"></div>
<nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="Main navigation">
  <a href="#map" data-mobile-tab="map" class="active">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5 8.5 4l7 2.5L21 4v13.5L15.5 20l-7-2.5L3 20V6.5Z"/><path d="M8.5 4v13.5M15.5 6.5V20"/></svg><small>Map</small>
  </a>
  <a href="#venues" data-mobile-tab="venues">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v3H4zM4 11h16v3H4zM4 17h16v3H4z"/></svg><small>Venues</small>
  </a>
  <a href="../profile/profile.html" data-mobile-tab="ratings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg><small>My Ratings</small>
  </a>
</nav>


<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">Add a venue</h2>
    <p class="sub" id="modal-sub">Log a place and its quietness so others know before they go.</p>

    <div id="fields-new-venue">
      <div class="field">
        <label for="venue-name">Venue name</label>
        <input type="text" id="venue-name" placeholder="Blue Hour Café">
      </div>
      <div class="field">
        <label for="venue-category">Category</label>
        <select id="venue-category">
          <option value="cafe">Café</option>
          <option value="restaurant">Restaurant</option>
          <option value="library">Library</option>
          <option value="gym">Gym</option>
          <option value="coworking">Coworking space</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="venue-time">Time of day for this rating</label>
      <select id="venue-time">
        <option value="morning">Morning</option>
        <option value="afternoon" selected>Afternoon</option>
        <option value="evening">Evening</option>
        <option value="night">Night</option>
      </select>
    </div>

    <div class="field">
      <label for="quiet-slider">Quietness</label>
      <div class="slider-row">
        <input type="range" id="quiet-slider" min="1" max="5" step="1" value="3" aria-describedby="slider-readout">
        <span class="slider-readout" id="slider-readout">3 · Moderate</span>
      </div>
      <div class="preview-waveform" id="preview-waveform" aria-hidden="true"></div>
    </div>

    <div class="checkbox-field">
      <input type="checkbox" id="venue-access">
      <label for="venue-access">Wheelchair / step-free access</label>
    </div>
    <div class="checkbox-field">
      <input type="checkbox" id="venue-toilet">
      <label for="venue-toilet">Gender-neutral toilet available</label>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn-primary" id="modal-submit">Save</button>
    </div>
  </div>
</div>

<link rel="stylesheet" href="/home/home.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>

<script src="/home/home.js"></script>
</body>
</html>
