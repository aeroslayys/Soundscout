# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Give Kotlin KSP and Android Gradle Plugin enough metaspace for SDK 58.
# Keep the heap and worker count bounded for developer machines.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false

# AndroidX package structure
android.useAndroidX=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Enable R8 in release builds to shrink, optimize and obfuscate the Java/Kotlin code.
android.enableMinifyInReleaseBuilds=true

# Architectures can be overridden from the CLI using -PreactNativeArchitectures=...
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Enable the React Native New Architecture.
newArchEnabled=true

# Use Hermes JavaScript engine.
hermesEnabled=true

# Enable edge-to-edge display support.
edgeToEdgeEnabled=true

# Expo image support
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Enable network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Use legacy packaging to compress native libraries in the resulting APK.
expo.useLegacyPackaging=false

# Opt out of built-in Kotlin and new DSL behavior that ships with AGP 9.
android.builtInKotlin=false
android.newDsl=false

expo.inlineModules.watchedDirectories=[]
